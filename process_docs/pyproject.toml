[project]
name = "tutoria-processdocs"
version = "0.0.1"
description = "This is a project that processes documents"
authors = [{ name = "Sara San Luís Rodríguez, Christian Carballo Lozano" }]
requires-python = "~=3.11"
readme = "README.md"
keywords = [
    "tutor.ia",
    "document-intelligence",
]
dependencies = [
    "pydantic>=2.7.1,<3",
    "pydantic-settings>=2.2.1,<3",
    "azure-storage-blob>=12.20.0,<13",
    "azure-ai-documentintelligence>=1.0.0b3,<2",
    "azure-identity>=1.17.1,<2",
    "tiktoken>=0.7.0,<0.8",
    "aiohttp>=3.9.5,<4",
    "azure-search-documents==11.4.0",
    "openai==1.45.1",
]

[dependency-groups]
dev = [
    "pyclean>=3.0.0,<4",
    "ruff>=0.4.1,<0.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tutoria-api"
version = "0.1.0"
description = ""
authors = [{ name = "Sara San Luís Rodríguez, Christian Carballo Lozano" }]
requires-python = "~=3.11"
readme = "README.md"
keywords = [
    "tutor.ia",
    "api",
]
dependencies = [
    "fastapi==0.111.0",
    "uvicorn>=0.29.0,<0.30",
    "openai>=1.51.0,<2",
    "python-dotenv>=1.0.1,<2",
    "azure-search-documents>=11.5.1,<12",
]

[dependency-groups]
dev = [
    "pyclean>=3.0.0,<4",
    "ruff>=0.4.1,<0.5",
]

[tool.uv]
package = false

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

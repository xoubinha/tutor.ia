[project]
name = "tutoria-aisrch"
version = "0.1.0"
description = ""
authors = [{ name = "Sara San Luís Rodríguez, Christian Carballo Lozano" }]
requires-python = "~=3.11"
readme = "README.md"
keywords = [
    "tutor.ia",
    "Azure AI Search",
]
dependencies = [
    "azure-identity>=1.18.0,<2",
    "azure-mgmt-search>=9.1.0,<10",
    "azure-search-documents>=11.5.1,<12",
    "pydantic>=2.9.2,<3",
    "pydantic-settings>=2.5.2,<3",
    "azure-core>=1.31.0,<2",
]

[dependency-groups]
dev = [
    "pyclean>=3.0.0,<4",
    "ruff>=0.4.1,<0.5",
]

[tool.uv]
package = false

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
